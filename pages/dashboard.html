<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Dashboard - Top Up BUSSID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#0ea5e9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Top Up BUSSID">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f4f8; min-height: 100vh; color: #1a1a2e; padding-bottom: 70px; }

        .alert { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-120px); padding: 16px 24px; border-radius: 12px; font-weight: 600; font-size: 15px; z-index: 999999; max-width: 90%; width: 400px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.12); opacity: 0; transition: all 0.3s ease; color: #fff; letter-spacing: 0.3px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .alert.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .alert.info { background: #0ea5e9; border-left: 5px solid #0284c7; }
        .alert.success { background: #10b981; border-left: 5px solid #059669; }
        .alert.error { background: #ef4444; border-left: 5px solid #dc2626; }
        .alert.warning { background: #f59e0b; border-left: 5px solid #d97706; }
        .alert.loading { background: #6366f1; border-left: 5px solid #4f46e5; }
        .alert-content { display: flex; align-items: center; gap: 10px; }
        .alert-icon { font-size: 20px; }

        .main-app { max-width: 1200px; margin: 0 auto; padding: 20px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 20px 24px; background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .logo h1 { color: #0c4a6e; font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .logo h1 i { color: #0ea5e9; }
        .subtitle { color: #64748b; font-size: 13px; margin-top: 4px; }
        .user-info { display: flex; gap: 12px; }

        .card { background: #fff; border-radius: 16px; margin-bottom: 20px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.04); animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card-header { background: #fff; padding: 20px 24px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        .card-header h2 { color: #0c4a6e; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .card-header h2 i { color: #0ea5e9; }
        .card-body { padding: 24px; color: #334155; }

        .account-profile { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; padding: 16px; background: #f8fafc; border-radius: 16px; }
        .profile-photo-container { width: 110px; height: 110px; border-radius: 50%; overflow: hidden; border: 3px solid #e0f2fe; flex-shrink: 0; background: #e0f2fe; }
        .profile-photo { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .profile-photo img { width: 100%; height: 100%; object-fit: cover; }
        .profile-photo i { font-size: 50px; color: #0ea5e9; }
        .profile-info { flex: 1; }
        .profile-info h3 { color: #0c4a6e; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .account-balance { color: #0ea5e9; font-size: 28px; font-weight: 700; }

        .facebook-info-section { background: #f0f9ff; border-radius: 12px; padding: 18px; margin-bottom: 18px; border-left: 4px solid #0ea5e9; }
        .facebook-info-section h4 { color: #0c4a6e; margin-bottom: 12px; font-size: 16px; font-weight: 600; }
        .facebook-info-details { display: flex; flex-direction: column; gap: 10px; }
        .fb-info-row { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; border-bottom: 1px solid #e0f2fe; }
        .fb-info-row:last-child { border-bottom: none; }
        .fb-info-label { min-width: 100px; color: #64748b; font-weight: 500; font-size: 13px; }
        .fb-info-value { color: #1e293b; font-weight: 500; font-size: 13px; flex: 1; }

        .bussid-info-section { background: #f0f9ff; border-radius: 12px; padding: 18px; margin-bottom: 20px; border-left: 4px solid #0ea5e9; }
        .bussid-info-section h4 { color: #0c4a6e; margin-bottom: 12px; font-size: 16px; font-weight: 600; }
        .bussid-info-details { display: flex; flex-direction: column; gap: 10px; }
        .info-row { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; border-bottom: 1px solid #e0f2fe; }
        .info-row:last-child { border-bottom: none; }
        .info-label { min-width: 100px; color: #64748b; font-weight: 500; font-size: 13px; }
        .info-value { color: #1e293b; font-weight: 500; font-size: 13px; flex: 1; }
        .playfab-id-full { font-family: monospace; font-size: 13px; background: #f1f5f9; padding: 4px 10px; border-radius: 6px; word-break: break-all; }
        .status-active { color: #10b981; background: #d1fae5; padding: 4px 10px; border-radius: 20px; display: inline-block; font-size: 13px; font-weight: 600; }

        .account-actions { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .account-actions .action-btn { width: 100%; padding: 18px !important; font-size: 18px !important; }

        .form-group { margin-bottom: 22px; }
        .form-group label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: #475569; font-size: 13px; font-weight: 600; }
        .form-group label i { color: #0ea5e9; }
        .form-input { width: 100%; padding: 14px 18px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; color: #1e293b; font-size: 15px; transition: all 0.2s ease; }
        .form-input:focus { outline: none; border-color: #0ea5e9; background: #fff; box-shadow: 0 0 0 4px rgba(14,165,233,0.1); }
        .form-input::placeholder { color: #94a3b8; }
        .form-hint { display: block; margin-top: 6px; color: #94a3b8; font-size: 12px; }

        .btn { padding: 14px 24px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: #fff; letter-spacing: 0.3px; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .btn:active { transform: scale(0.97); }
        .btn-block { width: 100%; }
        .btn-primary { background: #0ea5e9; color: #fff; }
        .btn-primary:hover { background: #0284c7; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        .btn-warning { background: #f59e0b; color: #1e293b; }
        .btn-warning:hover { background: #d97706; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #64748b; }
        .btn-secondary:hover { background: #475569; }
        .btn-purple { background: #6366f1; color: #fff; }
        .btn-purple:hover { background: #4f46e5; }
        .btn-icon { background: #f0f9ff; color: #0ea5e9; padding: 10px 18px; border-radius: 10px; border: 1px solid #bae6fd; font-size: 14px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 8px; }
        .btn-icon:hover { background: #e0f2fe; }
        .btn-whatsapp { background: #25D366; color: #fff; }
        .btn-whatsapp:hover { background: #128C7E; }
        .btn-quick { background: #fff; color: #0ea5e9; border: 2px solid #e0f2fe; padding: 12px 16px; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; font-weight: 600; flex: 1; text-align: center; }
        .btn-quick:hover { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }

        .quick-amounts { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; margin: 20px 0; }
        .current-account-info { background: #f8fafc; padding: 16px; border-radius: 12px; margin-bottom: 20px; border-left: 3px solid #0ea5e9; }
        .current-account-info p { margin-bottom: 8px; font-size: 15px; color: #475569; }
        .current-account-info p:last-child { margin-bottom: 0; }

        .user-profile-info { background: #f8fafc; border-radius: 12px; padding: 20px; margin-bottom: 24px; }
        .profile-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
        .profile-item:last-child { border-bottom: none; }
        .profile-label { color: #64748b; font-weight: 500; font-size: 14px; }
        .profile-value { font-weight: 600; color: #1e293b; font-size: 14px; }
        .highlight-black { background: #e2e8f0; padding: 4px 10px; border-radius: 6px; }
        .role-biru { color: #0ea5e9 !important; background: #e0f2fe; padding: 4px 10px; border-radius: 6px; }

        .expiry-days-left { font-size: 11px; padding: 2px 8px; border-radius: 12px; display: inline-block; font-weight: 600; }
        .days-green { background: #d1fae5; color: #059669; }
        .days-yellow { background: #fef3c7; color: #d97706; }
        .days-red { background: #fee2e2; color: #dc2626; }
        .days-permanent { background: #e0e7ff; color: #6366f1; }

        .settings-divider { margin: 24px 0 16px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; }
        .settings-divider h3 { color: #0c4a6e; font-size: 16px; font-weight: 600; }

        .transaction-item { background: #f8fafc; border-radius: 12px; padding: 16px; margin-bottom: 10px; border-left: 3px solid #0ea5e9; transition: all 0.2s ease; }
        .transaction-item:hover { background: #f1f5f9; transform: translateX(3px); }
        .transaction-item.topup { border-left-color: #10b981; }
        .transaction-item.kuras { border-left-color: #f59e0b; }
        .transaction-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .transaction-amount { font-weight: 700; font-size: 16px; }
        .transaction-details { display: flex; justify-content: space-between; color: #64748b; font-size: 13px; }
        .transaction-balance { display: flex; justify-content: space-between; color: #8899aa; font-size: 11px; margin-top: 6px; gap: 8px; }

        .history-header-actions { display: flex; gap: 10px; }
        .history-header-actions .btn-icon.btn-danger { color: #ef4444; border-color: #fecaca; }
        .history-header-actions .btn-icon.btn-danger:hover { background: #fee2e2; }
        .history-info { background: #fef3c7; border-radius: 8px; padding: 12px; margin-bottom: 16px; color: #92400e; font-size: 13px; }

        .receipt-content { background: #f8fafc; border-radius: 12px; padding: 24px; }
        .receipt-header { text-align: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px dashed #e2e8f0; }
        .receipt-header h3 { color: #0c4a6e; font-size: 22px; font-weight: 700; }
        .receipt-details { display: grid; gap: 10px; margin-bottom: 20px; }
        .receipt-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .receipt-row:last-child { border-bottom: none; }

        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.5); display: flex; align-items: center; justify-content: center; z-index: 99999; opacity: 0; visibility: hidden; transition: all 0.25s ease; padding: 20px; }
        .modal.active { opacity: 1; visibility: visible; }
        .modal-content { background: #fff; border-radius: 20px; padding: 36px; max-width: 460px; width: 100%; box-shadow: 0 25px 60px rgba(0,0,0,0.12); transform: scale(0.9); transition: transform 0.25s ease; }
        .modal.active .modal-content { transform: scale(1); }
        .modal-content h3 { color: #0c4a6e; font-size: 22px; margin-bottom: 16px; text-align: center; }
        .modal-content p { color: #64748b; font-size: 15px; line-height: 1.6; margin-bottom: 24px; text-align: center; }
        .modal-buttons { display: flex; gap: 12px; justify-content: center; }
        .modal-buttons .btn { min-width: 110px; padding: 12px 20px; flex: 1; }

        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #0ea5e9; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #trxLagiModal { display: none; opacity: 0; visibility: hidden; }
        #trxLagiModal.active { display: flex; opacity: 1; visibility: visible; }

        .expired-banner { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.97); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .expired-content { background: #fff; border: 1px solid #fecaca; border-radius: 20px; padding: 40px; max-width: 500px; width: 100%; position: relative; text-align: center; animation: fadeIn 0.3s ease; }
        .expired-content h3 { color: #dc2626; font-size: 22px; margin-bottom: 12px; }
        .expired-content p { color: #64748b; font-size: 15px; margin-bottom: 24px; }
        .expired-close { position: absolute; top: 16px; right: 16px; background: #f1f5f9; border: none; color: #64748b; font-size: 18px; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .expired-close:hover { background: #e2e8f0; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; box-shadow: 0 -2px 12px rgba(0,0,0,0.04); }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #94a3b8; font-size: 10px; gap: 3px; transition: 0.2s; cursor: pointer; padding: 4px 12px; }
        .bottom-nav a.active { color: #0ea5e9; }
        .bottom-nav a i { font-size: 20px; }

        .max-badge { display: inline-block; background: #fef3c7; color: #92400e; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 6px; }
        .amount-preview { text-align: center; margin: 12px 0; padding: 14px; background: #f0f9ff; border-radius: 10px; }
        .amount-preview .label { color: #64748b; font-size: 13px; margin-bottom: 4px; }
        .amount-preview .value { color: #0ea5e9; font-size: 22px; font-weight: 700; }

        .input-with-button { display: flex; gap: 10px; }
        .input-with-button .form-input { flex: 1; }
        .input-with-button .btn { padding: 14px 18px; white-space: nowrap; }
        .name-availability { margin-top: 10px; padding: 10px; border-radius: 8px; font-size: 13px; display: none; }

        @media(max-width:768px) {
            .header { flex-direction: column; gap: 16px; text-align: center; }
            .user-info { width: 100%; justify-content: center; }
            .card-header { flex-direction: column; gap: 12px; text-align: center; }
            .card-header h2 { flex-direction: column; gap: 8px; font-size: 18px; }
            .history-header-actions { flex-direction: column; width: 100%; }
            .modal-buttons { flex-direction: column; }
            .modal-buttons .btn { width: 100%; }
            .quick-amounts { grid-template-columns: repeat(2, 1fr); }
            .profile-item { flex-direction: column; align-items: flex-start; gap: 4px; }
            .account-profile { flex-direction: column; text-align: center; }
            .profile-info { text-align: center; }
            .account-actions { flex-direction: column; }
            .input-with-button { flex-direction: column; }
            .input-with-button .btn { width: 100%; }
            .btn { font-size: 14px; padding: 12px 18px; }
            .modal-content { padding: 24px; }
        }
        @media(max-width:480px) {
            .btn { padding: 12px 18px; font-size: 14px; }
            .quick-amounts { grid-template-columns: 1fr; }
            .profile-photo-container { width: 90px; height: 90px; }
            .profile-info h3 { font-size: 20px; }
            .account-balance { font-size: 22px; }
            .card-body { padding: 16px; }
            .card-header { padding: 16px; }
            .header { padding: 16px; }
            .logo h1 { font-size: 22px; }
        }
    </style>
    <script src="https://www.google.com/recaptcha/api.js?render=6LcVBn4tAAAAAINTTIleUbUZr1ZykvyB6WA-oOfT"></script>
</head>
<body>

    <div id="alert" class="alert"></div>

    <div id="loadingOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99999;justify-content:center;align-items:center">
        <div style="background:#1a1a2e;padding:30px 40px;border-radius:16px;text-align:center;color:#fff">
            <div class="spinner"></div>
            <p id="loadingMessage" style="margin-top:15px;font-size:14px">Memproses...</p>
        </div>
    </div>

    <div id="expiredBanner" class="expired-banner" style="display:none">
        <div class="expired-content">
            <button class="expired-close" onclick="closeExpiredBanner()"><i class="fas fa-times"></i></button>
            <div class="expired-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <h3>MASA AKTIF AKUN HABIS</h3>
            <p>Maaf masa aktif akun anda telah habis. Silakan perpanjang akses Anda.</p>
            <button class="btn btn-whatsapp" onclick="openWhatsApp()"><i class="fab fa-whatsapp"></i> Perpanjang Masa Aktif</button>
        </div>
    </div>

    <div id="trxLagiModal" class="modal" style="display:none">
        <div class="modal-content" style="max-width:400px">
            <h3 style="color:#0ea5e9;margin-bottom:20px;text-align:center"><i class="fas fa-redo"></i> MAU LANJUT TRX?</h3>
            <div style="display:flex;gap:15px;margin-bottom:20px">
                <button class="btn btn-success" onclick="window._pilihTopup()" style="flex:1;padding:15px"><i class="fas fa-arrow-up"></i> TOP UP</button>
                <button class="btn btn-warning" onclick="window._pilihKuras()" style="flex:1;padding:15px"><i class="fas fa-arrow-down"></i> KURAS</button>
            </div>
            <button class="btn btn-secondary btn-block" onclick="window._tutupTrxModal()"><i class="fas fa-arrow-left"></i> KEMBALI</button>
        </div>
    </div>

    <div id="mainApp" class="main-app" style="display:none">
        <div class="header">
            <div class="logo">
                <h1><i class="fas fa-bus"></i> TOP UP BUSSID</h1>
                <p class="subtitle">Top Up uang bussid</p>
            </div>
            <div class="user-info"></div>
        </div>

        <div class="main-content">
            <div class="card search-card">
                <div class="card-header"><h2><i class="fas fa-search"></i> CARI AKUN BUSSID</h2></div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="deviceId"><i class="fas fa-mobile-alt"></i> Device ID / X-Auth Token</label>
                        <input type="text" id="deviceId" placeholder="Masukkan Device ID atau Token" class="form-input">
                        <small class="form-hint"><i class="fas fa-info-circle"></i> Masukan device id atau x auth</small>
                    </div>
                    <button class="btn btn-primary btn-block" onclick="searchAccount()"><i class="fas fa-search"></i> CARI AKUN</button>
                </div>
            </div>

            <div id="accountInfo" class="card" style="display:none"></div>
            <div id="topupSection" class="card" style="display:none"></div>
            <div id="kurasSection" class="card" style="display:none"></div>
            <div id="changeNameSection" class="card" style="display:none"></div>
            <div id="historySection" class="card" style="display:none"></div>
            <div id="settingsSection" class="card" style="display:none"></div>
            <div id="receiptSection" class="card" style="display:none"></div>
        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav" style="display:none">
        <a href="#" class="active" onclick="navigateBottom('home')"><i class="fas fa-home"></i> Home</a>
        <a href="#" onclick="navigateBottom('riwayat')"><i class="fas fa-history"></i> Riwayat</a>
        <a href="#" onclick="navigateBottom('pengaturan')"><i class="fas fa-cog"></i> Pengaturan</a>
    </nav>

    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h3 id="modalConfirmTitle"></h3>
            <p id="modalConfirmMessage"></p>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="cancelConfirm()"><i class="fas fa-times"></i> BATAL</button>
                <button class="btn btn-danger" onclick="confirmAction()"><i class="fas fa-check"></i> LANJUTKAN</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
