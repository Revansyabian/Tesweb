<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Login - Top Up BUSSID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#0ea5e9">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-container { width: 100%; max-width: 420px; }
        .login-card { background: #fff; border-radius: 24px; padding: 45px 35px 35px; box-shadow: 0 25px 60px rgba(0,0,0,0.08); animation: fadeIn 0.4s ease; margin: auto; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header h1 { color: #0c4a6e; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .login-header h1 i { color: #0ea5e9; }
        .login-header p { color: #64748b; font-size: 14px; margin-top: 6px; }
        .login-footer { margin-top: 28px; text-align: center; color: #94a3b8; font-size: 13px; padding-top: 18px; border-top: 1px solid #f1f5f9; }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: #475569; font-size: 13px; font-weight: 600; }
        .form-group label i { color: #0ea5e9; }
        .form-input { width: 100%; padding: 14px 18px; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; color: #1e293b; font-size: 15px; transition: all 0.2s ease; }
        .form-input:focus { outline: none; border-color: #0ea5e9; background: #fff; box-shadow: 0 0 0 4px rgba(14,165,233,0.1); }
        .form-input::placeholder { color: #94a3b8; }
        .btn { padding: 14px 24px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 10px; color: #fff; letter-spacing: 0.3px; width: 100%; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: #0ea5e9; }
        .btn-primary:hover { background: #0284c7; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .recaptcha-wrapper { margin-bottom: 20px; display: flex; justify-content: center; }
        .password-counter { text-align: right; font-size: 11px; color: #94a3b8; margin-top: 4px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid #0ea5e9; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .grecaptcha-badge { visibility: hidden !important; }
        @media(max-width:480px) { .login-card { padding: 30px 22px; } .login-header h1 { font-size: 22px; } }
    </style>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

    <div id="loadingOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99999;justify-content:center;align-items:center">
        <div style="background:#1a1a2e;padding:30px 40px;border-radius:16px;text-align:center;color:#fff">
            <div class="spinner"></div>
            <p id="loadingMessage" style="margin-top:15px;font-size:14px">Memproses...</p>
        </div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1><i class="fas fa-bus"></i> TOP UP BUSSID</h1>
                <p>Top Up BUS SIMULATOR ID</p>
            </div>
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" placeholder="Masukkan username" class="form-input" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Masukkan password" class="form-input" maxlength="20" autocomplete="current-password">
                <div class="password-counter"><span id="passwordCharCount">0/20</span></div>
            </div>
            <div class="recaptcha-wrapper">
                <div class="g-recaptcha" data-sitekey="6LfYOH4tAAAAAO48ez84cjF25XOYz3cN0OOjZ9pc" data-callback="onCaptchaVerified" data-expired-callback="onCaptchaExpired"></div>
            </div>
            <button class="btn btn-primary" id="btnLogin" disabled onclick="login()">
                <i class="fas fa-sign-in-alt"></i> LOGIN
            </button>
            <div class="login-footer">
                <p><i class="fas fa-info-circle"></i> Hubungi admin untuk membuat akun</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
