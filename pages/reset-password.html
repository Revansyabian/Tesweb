<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Reset Password - Top Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#00BFFF">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .reset-container { width: 100%; max-width: 420px; }
        .reset-card { background: #fff; border-radius: 16px; padding: 40px 35px 35px; box-shadow: 0 8px 32px rgba(0, 191, 255, 0.12); border: 1px solid #e2e8f0; animation: fadeIn 0.4s ease; margin: auto; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .reset-header { text-align: center; margin-bottom: 28px; }
        .reset-header h1 { color: #1e293b; font-size: 22px; font-weight: 700; }
        .reset-header p { color: #64748b; font-size: 14px; margin-top: 6px; }
        .reset-footer { margin-top: 24px; text-align: center; color: #94a3b8; font-size: 13px; padding-top: 18px; border-top: 1px solid #f1f5f9; }
        .reset-footer a { color: #00BFFF; text-decoration: none; font-weight: 600; }
        .reset-footer a:hover { text-decoration: underline; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: #475569; font-size: 13px; font-weight: 600; }
        .form-group label i { color: #00BFFF; width: 16px; }
        .form-input { width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; transition: 0.2s; }
        .form-input:focus { outline: none; border-color: #00BFFF; box-shadow: 0 0 0 3px rgba(0, 191, 255, 0.1); }
        .form-input.error { border-color: #ef4444; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #00BFFF; color: #fff; font-weight: 600; cursor: pointer; font-size: 15px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn:hover { background: #0099CC; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .recaptcha-wrapper { margin-bottom: 16px; display: flex; justify-content: center; }
        .error-message { background: #fef2f2; color: #ef4444; padding: 10px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 16px; display: none; }
        .error-message.show { display: block; }
        .success-message { background: #ecfdf5; color: #10b981; padding: 10px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 16px; display: none; }
        .success-message.show { display: block; }
        .spinner { width: 30px; height: 30px; border: 3px solid #e2e8f0; border-top: 3px solid #00BFFF; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .info-box { background: #E6F9FF; border: 1px solid #bae6fd; border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 12px; color: #475569; line-height: 1.5; }
        .info-box i { color: #00BFFF; margin-right: 6px; }
        @media(max-width:480px) { .reset-card { padding: 28px 20px; } .reset-header h1 { font-size: 20px; } }
    </style>
</head>
<body>

    <div class="reset-container">
        <div class="reset-card">
            <div class="reset-header">
                <h1>Reset Password</h1>
                <p>Masukkan username untuk menerima link reset</p>
            </div>

            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
            </div>

            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i> <span id="successText"></span>
            </div>

            <div class="info-box">
                <i class="fas fa-info-circle"></i> Link reset akan dikirim ke <b>email terdaftar</b>. Link <b>expired dalam 15 menit</b>.
            </div>

            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" placeholder="Masukkan username Anda" class="form-input" autocomplete="username" oninput="validateUsernameInput()">
            </div>

            <div class="recaptcha-wrapper">
                <div class="g-recaptcha" data-sitekey="6LfYOH4tAAAAAO48ez84cjF25XOYz3cN0OOjZ9pc"></div>
            </div>

            <button class="btn" id="btnReset" onclick="resetPassword()">
                <i class="fas fa-paper-plane"></i> KIRIM LINK RESET
            </button>

            <div class="reset-footer">
                <p>Sudah ingat password? <a href="/pages/login">Login di sini</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script>
        var API_RESET = '/api/reset-pw';
        var API_SECRET = '1417-1426-1527-1517';
        var fingerprint = '';
        var resetInProgress = false;

        async function getFingerprint() {
            var fp = '';
            fp += navigator.userAgent || '';
            fp += navigator.language || '';
            fp += (screen.width || 0) + 'x' + (screen.height || 0);
            fp += screen.colorDepth || '';
            fp += new Date().getTimezoneOffset();
            fp += navigator.hardwareConcurrency || '';
            fp += navigator.deviceMemory || '';
            fp += navigator.platform || '';
            return CryptoJS.MD5(fp).toString();
        }

        function sanitize(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#x27;')
                .replace(/`/g, '&#96;')
                .replace(/javascript:/gi, '')
                .replace(/on\w+=/gi, '')
                .replace(/<script/gi, '')
                .replace(/<\/script/gi, '');
        }

        function validateUsernameInput() {
            var input = document.getElementById('username');
            var value = input.value;
            var cleaned = value.replace(/[^a-zA-Z0-9_.]/g, '');
            if (value !== cleaned) {
                input.value = cleaned;
                Swal.fire({ icon: "warning", title: "Simbol Tidak Diizinkan!", text: "Username hanya boleh huruf, angka, underscore (_), dan titik (.)", timer: 2000, showConfirmButton: false });
            }
        }

        function showError(msg) {
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorMessage').classList.add('show');
            document.getElementById('successMessage').classList.remove('show');
        }

        function showSuccess(msg) {
            document.getElementById('successText').textContent = msg;
            document.getElementById('successMessage').classList.add('show');
            document.getElementById('errorMessage').classList.remove('show');
        }

        function setButtonLoading(loading) {
            var btn = document.getElementById('btnReset');
            btn.disabled = loading;
            btn.innerHTML = loading ? '<i class="fas fa-spinner fa-spin"></i> MENGIRIM...' : '<i class="fas fa-paper-plane"></i> KIRIM LINK RESET';
        }

        async function resetPassword() {
            if (resetInProgress) return;
            resetInProgress = true;
            
            try {
                var username = sanitize(document.getElementById('username').value.trim());
                
                if (!username || username.length < 3) {
                    Swal.fire({ icon: "warning", title: "Username Tidak Valid!", text: "Masukkan username minimal 3 karakter.", confirmButtonColor: "#00BFFF" });
                    resetInProgress = false;
                    return;
                }
                
                var usernameRegex = /^[a-zA-Z0-9_.]+$/;
                if (!usernameRegex.test(username)) {
                    Swal.fire({ icon: "error", title: "Simbol Tidak Diizinkan!", confirmButtonColor: "#ef4444" });
                    resetInProgress = false;
                    return;
                }
                
                var captchaResponse = '';
                if (typeof grecaptcha !== 'undefined') {
                    captchaResponse = grecaptcha.getResponse();
                }
                
                if (!captchaResponse || captchaResponse.length === 0) {
                    Swal.fire({ icon: "warning", title: "reCAPTCHA Diperlukan!", text: "Centang \"I'm not a robot\" dulu ya!", confirmButtonColor: "#00BFFF" });
                    resetInProgress = false;
                    return;
                }
                
                setButtonLoading(true);
                
                if (!fingerprint) fingerprint = await getFingerprint();
                
                var payload = {
                    action: 'request_reset',
                    username: username,
                    captchaToken: captchaResponse,
                    timestamp: Date.now()
                };
                
                var encryptedPayload = CryptoJS.AES.encrypt(JSON.stringify(payload), API_SECRET).toString();
                
                var res = await fetch(API_RESET, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Fingerprint': fingerprint
                    },
                    body: JSON.stringify({ data: encryptedPayload })
                });
                
                var result = await res.json();
                
                if (result.data) {
                    var dec = CryptoJS.AES.decrypt(result.data, API_SECRET).toString(CryptoJS.enc.Utf8);
                    result = JSON.parse(dec);
                }
                
                setButtonLoading(false);
                
                if (result && result.success) {
                    if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
                    
                    var maskedEmail = result.maskedEmail || '';
                    var msg = maskedEmail ? 'Link reset telah dikirim ke ' + maskedEmail + '. Link expired dalam 15 menit.' : 'Jika username terdaftar, link reset akan dikirim ke email Anda.';
                    
                    showSuccess(msg);
                    
                    Swal.fire({
                        icon: "success",
                        title: "Link Terkirim!",
                        text: msg,
                        timer: 4000,
                        showConfirmButton: false
                    });
                    
                    document.getElementById('username').value = '';
                } else {
                    Swal.fire({ icon: "error", title: "Gagal!", text: "Terjadi kesalahan. Coba lagi nanti.", confirmButtonColor: "#ef4444" });
                    if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
                }
                
            } catch (error) {
                setButtonLoading(false);
                Swal.fire({ icon: "error", title: "Error!", text: "Gagal menghubungkan ke server!", confirmButtonColor: "#ef4444" });
                if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
            }
            
            resetInProgress = false;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            document.getElementById('username').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') resetPassword();
            });
            if (!fingerprint) fingerprint = await getFingerprint();
        });
    </script>
</body>
</html>
