<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bussid Top Up</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F8FAFC;
            min-height: 100vh;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .menu-card {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .menu-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 18px 20px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #FFFFFF;
            transition: 0.2s;
            font-family: inherit;
            text-align: left;
        }

        .menu-btn:hover {
            filter: brightness(1.1);
        }

        .menu-btn:active {
            filter: brightness(0.9);
        }

        .btn-login { background: #00BFFF; }
        .btn-topup { background: #10B981; }
        .btn-kuras { background: #F59E0B; }
        .btn-gantinama { background: #8B5CF6; }
        .btn-admin { background: #EC4899; }
        .btn-bantuan { background: #3B82F6; }
        .btn-batal { background: #EF4444; }

        .btn-batal {
            justify-content: center;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="menu-card">
            <button class="menu-btn btn-login" onclick="sendToBot('login')">Login</button>
            <button class="menu-btn btn-topup" onclick="sendToBot('topup')">Top Up</button>
            <button class="menu-btn btn-kuras" onclick="sendToBot('kuras')">Kuras</button>
            <button class="menu-btn btn-gantinama" onclick="sendToBot('gantinama')">Ganti Nama</button>
            <button class="menu-btn btn-admin" onclick="sendToBot('admin')">Admin Panel</button>
            <button class="menu-btn btn-bantuan" onclick="sendToBot('bantuan')">Bantuan</button>
            <button class="menu-btn btn-batal" onclick="tg.close()">Batal</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#F8FAFC');
        tg.setBackgroundColor('#F8FAFC');

        function sendToBot(action) {
            tg.sendData(action);
            tg.close();
        }
    </script>
</body>
</html>
