<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>BUSSID TopUp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#00BFFF">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #00BFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 24px;
            padding: 48px 36px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(0, 191, 255, 0.1);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            object-fit: cover;
            background: #f0f9ff;
            padding: 6px;
            margin: 0 auto 20px;
            display: block;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .logo i {
            font-size: 60px;
            color: #00BFFF;
            line-height: 88px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .title span {
            color: #00BFFF;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .alert-box {
            background: #E6F9FF;
            border: 1px solid #bae6fd;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }

        .alert-box i {
            color: #00BFFF;
            font-size: 20px;
            margin-right: 8px;
        }

        .alert-box .alert-text {
            font-size: 14px;
            color: #0c4a6e;
            font-weight: 500;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: 0.2s;
            width: 100%;
        }

        .btn-primary {
            background: #00BFFF;
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 191, 255, 0.3);
        }
        .btn-primary:hover {
            background: #0099CC;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 191, 255, 0.4);
        }

        .footer-text {
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }

        .footer-text a {
            color: #00BFFF;
            text-decoration: none;
            font-weight: 600;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }

        .divider {
            height: 1px;
            background: #e2e8f0;
            margin: 16px 0;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px;
            }
            .title {
                font-size: 18px;
            }
        }
    </style>
    <script src="https://www.google.com/recaptcha/api.js?render=6LcVBn4tAAAAAINTTIleUbUZr1ZykvyB6WA-oOfT"></script>
</head>
<body>

    <!-- MAIN CONTAINER -->
    <div class="container" id="mainContainer">
        <div class="logo">
            <i class="fas fa-cube"></i>
        </div>

        <h1 class="title">Revan<span>Store</span></h1>
        <p class="subtitle">Top Up BUSSID Terpercaya</p>

        <div class="alert-box">
            <span class="alert-text">Hai! Selamat datang di Web Top Up BUSSID</span>
        </div>

        <button class="btn btn-primary" onclick="goToDashboard()">
            <i class="fas fa-arrow-right"></i> Masuk Dashboard
        </button>

        <div class="divider"></div>

        <p class="footer-text">
            Belum punya akun? <a href="/pages/register">Silakan daftar</a>
        </p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script>
        var API_REVANSTORE = '/api/revanstoreV2';
        var WHATSAPP_NUMBER = '6285199120995';
        var API_SECRET = '1417-1426-1527-1517';
        var RECAPTCHA_V3_SITE_KEY = '6LcVBn4tAAAAAINTTIleUbUZr1ZykvyB6WA-oOfT';
        var fingerprint = '';
        var isBlocked = false;
        var blockedChecked = false;

        function goToDashboard() {
            window.location.href = '/pages/dashboard';
        }

        function showBlockedScreen() {
            var html = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0f9ff 0%,#bae6fd 50%,#7dd3fc 100%);padding:20px;font-family:\'Segoe UI\',sans-serif;">' +
                '<div style="background:#ffffff;border-radius:24px;padding:48px 36px;width:100%;max-width:420px;text-align:center;box-shadow:0 20px 60px rgba(0,191,255,0.15);border:1px solid rgba(0,191,255,0.1);">' +
                '<div style="font-size:72px;color:#f59e0b;margin-bottom:12px;">🚫</div>' +
                '<h2 style="font-size:24px;font-weight:700;color:#0c4a6e;margin-bottom:8px;">AKSES DITOLAK</h2>' +
                '<p style="font-size:14px;color:#64748b;margin-bottom:6px;">Akses ditolak, jika ingin dibuka silakan hubungi admin.</p>' +
                '<div style="background:#fef3c7;color:#92400e;padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;margin:16px 0 24px;">Durasi: PERMANEN</div>' +
                '<button onclick="window.open(\'https://wa.me/' + WHATSAPP_NUMBER + '?text=Assalamualaikum%20admin%2C%20akses%20saya%20diblokir\',\'_blank\')" style="display:inline-flex;align-items:center;gap:10px;padding:12px 32px;background:#25D366;color:#fff;border:none;border-radius:30px;font-weight:600;font-size:15px;cursor:pointer;transition:0.2s;font-family:\'Segoe UI\',sans-serif;">' +
                '<i class="fab fa-whatsapp"></i> Hubungi Admin</button></div></div>';

            document.body.innerHTML = html;
        }

        function tampilkanMaintenance(data) {
            var judul = (data && (data.title || data.judul)) ? (data.title || data.judul) : 'SEDANG PERBAIKAN';
            var pesan = (data && (data.message || data.pesan)) ? (data.message || data.pesan) : 'Silakan kembali beberapa saat lagi.';
            var sampai = (data && (data.until || data.sampai)) ? (data.until || data.sampai) : null;
            var estimasi = sampai ? 'Estimasi selesai: ' + new Date(sampai).toLocaleString('id-ID') : 'Mohon maaf atas ketidaknyamanan ini.';

            document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#00BFFF;padding:20px;font-family:\'Segoe UI\',sans-serif;">' +
                '<div style="background:#fff;border-radius:12px;padding:28px 20px;max-width:340px;width:100%;text-align:center;border:2px solid #E63946;box-shadow:0 4px 20px rgba(0,0,0,0.15);">' +
                '<div style="font-size:16px;font-weight:700;color:#E63946;background:#FDE8E8;display:inline-block;padding:4px 12px;border-radius:6px;">' + judul + '</div>' +
                '<p style="font-size:13px;color:#555;margin:12px 0;background:#f8f8f8;padding:8px;border-radius:6px;">' + pesan + '</p>' +
                '<div style="background:#FDE8E8;color:#E63946;padding:6px 10px;border-radius:6px;font-weight:600;font-size:12px;margin-bottom:16px;">' + estimasi + '</div>' +
                '<button onclick="window.open(\'https://wa.me/' + WHATSAPP_NUMBER + '?text=Assalamualaikum%20admin%2C%20info%20perbaikan\',\'_blank\')" style="display:inline-flex;align-items:center;padding:10px 16px;background:#E63946;color:#fff;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;">Hubungi Admin</button></div></div>';
        }

        async function getFingerprint() {
            if (fingerprint) return fingerprint;
            var fp = '';
            fp += navigator.userAgent || '';
            fp += navigator.language || '';
            fp += (screen.width || 0) + 'x' + (screen.height || 0);
            fp += screen.colorDepth || '';
            fp += new Date().getTimezoneOffset();
            fp += navigator.hardwareConcurrency || '';
            fp += navigator.deviceMemory || '';
            fp += navigator.platform || '';
            fingerprint = CryptoJS.MD5(fp).toString();
            return fingerprint;
        }

        async function getRecaptchaV3Token(action) {
            try {
                return await grecaptcha.execute(RECAPTCHA_V3_SITE_KEY, { action: action });
            } catch (e) {
                return null;
            }
        }

        async function periksaMaintenance() {
            try {
                var fp = await getFingerprint();
                var payload = {
                    path: 'maintenance_status',
                    method: 'GET',
                    data: null,
                    timestamp: Date.now()
                };
                var encryptedPayload = CryptoJS.AES.encrypt(JSON.stringify(payload), API_SECRET).toString();
                var res = await fetch(API_REVANSTORE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Fingerprint': fp
                    },
                    body: JSON.stringify({ data: encryptedPayload })
                });
                var result = await res.json();
                if (result.encrypted && result.data) {
                    var dec = CryptoJS.AES.decrypt(result.data, API_SECRET).toString(CryptoJS.enc.Utf8);
                    if (dec) result = JSON.parse(dec);
                }
                if (result && (result.maintenance === true || result.title || result.message)) {
                    return result;
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        async function checkBlocked() {
            if (blockedChecked) return isBlocked;
            
            try {
                var fp = await getFingerprint();
                var captchaToken = await getRecaptchaV3Token('check_blocked');
                
                var payload = {
                    path: 'check_blocked',
                    method: 'POST',
                    data: {
                        fingerprint: fp,
                        captchaToken: captchaToken
                    },
                    timestamp: Date.now()
                };
                
                var encryptedPayload = CryptoJS.AES.encrypt(JSON.stringify(payload), API_SECRET).toString();
                
                var res = await fetch(API_REVANSTORE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Fingerprint': fp
                    },
                    body: JSON.stringify({ data: encryptedPayload })
                });
                
                var result = await res.json();
                
                if (result.encrypted && result.data) {
                    var dec = CryptoJS.AES.decrypt(result.data, API_SECRET).toString(CryptoJS.enc.Utf8);
                    if (dec) result = JSON.parse(dec);
                }
                
                if (result && result.blocked === true) {
                    isBlocked = true;
                    blockedChecked = true;
                    showBlockedScreen();
                    return true;
                }
                
                isBlocked = false;
                blockedChecked = true;
                return false;
                
            } catch (e) {
                console.error('[CHECK BLOCKED] Error:', e);
                isBlocked = false;
                blockedChecked = true;
                return false;
            }
        }

        (async function() {
            grecaptcha.ready(async function() {
                var maintenance = await periksaMaintenance();
                if (maintenance) { tampilkanMaintenance(maintenance); return; }

                var blocked = await checkBlocked();
                if (blocked) {
                    return;
                }
            });
        })();
    </script>
</body>
</html>
