<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>BUSSID TopUp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#00BFFF">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --sky: #00BFFF;
            --sky-dark: #0099CC;
            --sky-soft: #E6F9FF;
            --white: #fff;
            --red: #E63946;
            --red-soft: #FDE8E8;
            --black: #111;
            --gray: #555;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #00BFFF;
            color: var(--black);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .blocked {
            background: var(--white);
            border: 2px solid var(--red);
            border-radius: 12px;
            padding: 28px 20px;
            max-width: 340px;
            margin: 40px auto;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .blocked__title {
            font-size: 16px;
            font-weight: 700;
            color: var(--red);
            background: var(--red-soft);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
        }
        .blocked__msg {
            font-size: 13px;
            color: var(--gray);
            margin: 12px 0;
            background: #f8f8f8;
            padding: 8px;
            border-radius: 6px;
        }
        .blocked__badge {
            display: inline-block;
            background: var(--red-soft);
            color: var(--red);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.1s ease;
        }
        .btn--red {
            background: var(--red);
            color: var(--white);
            border: 2px solid var(--white);
            box-shadow: 0 4px 14px rgba(0,0,0,0.2);
        }
        .btn--red:hover { opacity: 0.85; }
    </style>
    <script src="https://www.google.com/recaptcha/api.js?render=6LcVBn4tAAAAAINTTIleUbUZr1ZykvyB6WA-oOfT"></script>
</head>
<body>

    <!-- LANDING / LOADING -->
    <div id="landingPage" style="position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #00BFFF; display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 9999; overflow: hidden;">
        <div style="position: absolute; top: 10%; left: 10%; width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.1);"></div>
        <div style="position: absolute; bottom: 20%; right: 15%; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,0.1);"></div>
        <div style="position: absolute; top: 60%; left: 5%; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.1);"></div>
        <div style="position: absolute; bottom: 10%; left: 20%; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.1);"></div>
        <div style="position: absolute; top: 20%; right: 5%; width: 90px; height: 90px; border-radius: 50%; background: rgba(255,255,255,0.1);"></div>
        <div style="text-align: center; color: white; padding: 20px; z-index: 2;">
            <img src="tes.jpeg" alt="Logo" style="width: 100px; height: 100px; border-radius: 20px; object-fit: cover; background: #fff; padding: 6px; box-shadow: 0 6px 24px rgba(0,0,0,0.25);" onerror="this.style.display='none'">
            <h1 style="font-size: 1.6rem; margin: 15px 0; font-weight: bold; font-family: Arial, sans-serif; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">SELAMAT DATANG DI WEB TOP UP BUSSID</h1>
            <p style="font-size: 0.95rem; margin-bottom: 30px; max-width: 500px; line-height: 1.5; font-weight: 500; font-family: Arial, sans-serif;">Mengalihkan ke dashboard...</p>
            <div style="margin: 25px 0;">
                <div style="width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; margin: 0 auto 10px; animation: spin 1s linear infinite;"></div>
                <p style="font-size: 0.9rem; color: white; font-weight: 500; font-family: Arial, sans-serif;">Sedang memuat...</p>
            </div>
        </div>
    </div>

    <!-- BLOCKED -->
    <div id="blockedScreen" style="display:none; padding: 40px 16px;">
        <div class="blocked">
            <div class="blocked__title" id="blockedTitle">Akses Ditolak</div>
            <p class="blocked__msg" id="blockedMessage">Maaf, akses Anda ditolak.</p>
            <div class="blocked__badge" id="blockedInfo">akses di block</div>
            <br>
            <button class="btn btn--red" onclick="contactAdmin()">Hubungi Admin</button>
        </div>
    </div>

    <!-- MAINTENANCE (dibuat via JS) -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script>
        var API_REVANSTORE = '/api/revanstoreV2';
        var WHATSAPP_NUMBER = '6285199120995';
        var STORAGE_KEY = 'app_data';
        var STORAGE_SECRET = 'session';
        var API_SECRET = '1417-1426-1527-1517';
        var RECAPTCHA_V3_SITE_KEY = '6LcVBn4tAAAAAINTTIleUbUZr1ZykvyB6WA-oOfT';

        function showBlocked(title, message, info) {
            document.getElementById('landingPage').style.display = 'none';
            document.getElementById('blockedScreen').style.display = 'block';
            if (title) document.getElementById('blockedTitle').textContent = title;
            if (message) document.getElementById('blockedMessage').textContent = message;
            if (info) document.getElementById('blockedInfo').textContent = info;
        }

        function contactAdmin() {
            window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=Assalamualaikum%20admin%2C%20saya%20ingin%20bertanya', '_blank');
        }

        async function getFingerprint() {
            var fp = '';
            fp += navigator.userAgent || '';
            fp += navigator.language || '';
            fp += (screen.width || 0) + 'x' + (screen.height || 0);
            fp += screen.colorDepth || '';
            fp += new Date().getTimezoneOffset();
            fp += navigator.hardwareConcurrency || '';
            fp += navigator.deviceMemory || '';
            fp += navigator.platform || '';
            return CryptoJS.MD5(fp).toString();
        }

        async function getRecaptchaV3Token(action) {
            try {
                return await grecaptcha.execute(RECAPTCHA_V3_SITE_KEY, { action: action });
            } catch (e) {
                return null;
            }
        }

        async function periksaMaintenance() {
            try {
                var payload = {
                    path: 'maintenance_status',
                    method: 'GET',
                    data: null,
                    timestamp: Date.now()
                };
                var encryptedPayload = CryptoJS.AES.encrypt(JSON.stringify(payload), API_SECRET).toString();
                var res = await fetch(API_REVANSTORE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Fingerprint': await getFingerprint()
                    },
                    body: JSON.stringify({ data: encryptedPayload })
                });
                var result = await res.json();
                if (result.encrypted && result.data) {
                    var dec = CryptoJS.AES.decrypt(result.data, API_SECRET).toString(CryptoJS.enc.Utf8);
                    if (dec) result = JSON.parse(dec);
                }
                if (result && (result.maintenance === true || result.title || result.message)) {
                    return result;
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        function tampilkanMaintenance(data) {
            var judul = (data && (data.title || data.judul)) ? (data.title || data.judul) : 'SEDANG PERBAIKAN';
            var pesan = (data && (data.message || data.pesan)) ? (data.message || data.pesan) : 'Silakan kembali beberapa saat lagi.';
            var sampai = (data && (data.until || data.sampai)) ? (data.until || data.sampai) : null;
            var estimasi = sampai ? 'Estimasi selesai: ' + new Date(sampai).toLocaleString('id-ID') : 'Mohon maaf atas ketidaknyamanan ini.';

            document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#00BFFF;padding:20px;font-family:\'Segoe UI\',sans-serif;">' +
                '<div style="background:#fff;border-radius:12px;padding:28px 20px;max-width:340px;width:100%;text-align:center;border:2px solid #E63946;box-shadow:0 4px 20px rgba(0,0,0,0.15);">' +
                '<div style="font-size:16px;font-weight:700;color:#E63946;background:#FDE8E8;display:inline-block;padding:4px 12px;border-radius:6px;">' + judul + '</div>' +
                '<p style="font-size:13px;color:#555;margin:12px 0;background:#f8f8f8;padding:8px;border-radius:6px;">' + pesan + '</p>' +
                '<div style="background:#FDE8E8;color:#E63946;padding:6px 10px;border-radius:6px;font-weight:600;font-size:12px;margin-bottom:16px;">' + estimasi + '</div>' +
                '<button onclick="window.open(\'https://wa.me/' + WHATSAPP_NUMBER + '?text=Assalamualaikum%20admin%2C%20info%20perbaikan\',\'_blank\')" style="display:inline-flex;align-items:center;padding:10px 16px;background:#E63946;color:#fff;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;">Hubungi Admin</button></div></div>';
        }

        async function checkBlockedSilently() {
            try {
                var fingerprint = await getFingerprint();
                var captchaToken = await getRecaptchaV3Token('check_blocked');
                var payload = {
                    path: 'check_blocked',
                    method: 'POST',
                    data: { fingerprint: fingerprint, captchaToken: captchaToken },
                    timestamp: Date.now()
                };
                var encryptedPayload = CryptoJS.AES.encrypt(JSON.stringify(payload), API_SECRET).toString();
                var res = await fetch(API_REVANSTORE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Fingerprint': fingerprint },
                    body: JSON.stringify({ data: encryptedPayload })
                });
                var result = await res.json();
                if (result.encrypted && result.data) {
                    var dec = CryptoJS.AES.decrypt(result.data, API_SECRET).toString(CryptoJS.enc.Utf8);
                    if (dec) result = JSON.parse(dec);
                }
                return result && result.blocked;
            } catch (e) {
                return false;
            }
        }

        (async function() {
            grecaptcha.ready(async function() {
                var maintenance = await periksaMaintenance();
                if (maintenance) { tampilkanMaintenance(maintenance); return; }

                var blocked = await checkBlockedSilently();
                if (blocked) {
                    showBlocked('Akses Ditolak', 'Maaf, akses Anda ditolak.', 'IP Di block');
                    return;
                }

                // LANGSUNG REDIRECT KE DASHBOARD
                window.location.href = '/pages/dashboard';
            });
        })();
    </script>
</body>
</html>
