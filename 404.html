<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #bae6fd, #7dd3fc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #0c4a6e;
        }
        .container {
            text-align: center;
            background: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.1);
        }
        .icon { font-size: 70px; color: #0ea5e9; margin-bottom: 20px; }
        h1 { font-size: 60px; font-weight: 800; color: #0c4a6e; margin-bottom: 10px; }
        h2 { font-size: 20px; margin-bottom: 10px; color: #0c4a6e; }
        p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #0ea5e9;
            color: #fff;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn:hover { background: #0284c7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon"><i class="fas fa-map-signs"></i></div>
        <h1>404</h1>
        <h2>Halaman Tidak Ditemukan</h2>
        <p>Maaf, halaman yang kamu cari ga ada. Mungkin udah dipindahin atau dihapus.</p>
        <a href="/" class="btn"><i class="fas fa-home"></i> Kembali ke Beranda</a>
    </div>
</body>
</html>
