<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Top Up BUSSID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#0ea5e9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .loading-container {
            text-align: center;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading-icon {
            font-size: 80px;
            color: #0ea5e9;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }
        .loading-title {
            color: #0c4a6e;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .loading-title i { color: #0ea5e9; }
        .loading-subtitle { color: #64748b; font-size: 14px; margin-bottom: 24px; }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e0f2fe;
            border-top: 4px solid #0ea5e9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .loading-text { color: #64748b; font-size: 13px; margin-top: 16px; }
        .blocked-container {
            background: #fff;
            border-radius: 24px;
            padding: 48px 36px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.4s ease;
            display: none;
        }
        .blocked-icon { font-size: 72px; margin-bottom: 16px; }
        .blocked-title { color: #dc2626; font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .blocked-message { color: #64748b; font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
        .blocked-box {
            background: #fef3c7;
            color: #92400e;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            letter-spacing: 0.3px;
            text-decoration: none;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15); }
        .btn-whatsapp { background: #25D366; }
        .btn-whatsapp:hover { background: #128C7E; }
        @media(max-width:480px) {
            .loading-title { font-size: 22px; }
            .loading-icon { font-size: 60px; }
            .blocked-container { padding: 36px 24px; }
            .blocked-icon { font-size: 56px; }
            .blocked-title { font-size: 18px; }
        }
    </style>
    <script src="https://www.google.com/recaptcha/api.js?render=6LcVBn4tAAAAAINTTIleUbUZr1ZykvyB6WA-oOfT"></script>
</head>
<body>

    <div id="loadingScreen" class="loading-container">
        <div class="loading-icon"><i class="fas fa-bus"></i></div>
        <div class="loading-title"><i class="fas fa-shield-alt"></i> TOP UP BUSSID</div>
        <p class="loading-subtitle">Memeriksa keamanan...</p>
        <div class="spinner"></div>
        <p class="loading-text" id="loadingText">Menghubungkan ke server...</p>
    </div>

    <div id="blockedScreen" class="blocked-container">
        <div class="blocked-icon">🚫</div>
        <div class="blocked-title" id="blockedTitle">AKSES DITOLAK</div>
        <p class="blocked-message" id="blockedMessage">Maaf, akses Anda telah ditolak oleh sistem keamanan.</p>
        <div class="blocked-box" id="blockedInfo">🔒 IP atau perangkat Anda terdeteksi mencurigakan.</div>
        <button class="btn btn-whatsapp" onclick="contactAdmin()">
            <i class="fab fa-whatsapp"></i> Hubungi Admin
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script>
        var API_REVANSTORE = '/api/revanstore';
        var WHATSAPP_NUMBER = '6285199120995';
        var STORAGE_KEY = 'bussid_session';
        var STORAGE_SECRET = 'bussid_session_secret_key';
        var RECAPTCHA_V3_SITE_KEY = '6LcVBn4tAAAAAINTTIleUbUZr1ZykvyB6WA-oOfT';

        function showBlockedScreen(title, message, info) {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('blockedScreen').style.display = 'block';
            if (title) document.getElementById('blockedTitle').textContent = title;
            if (message) document.getElementById('blockedMessage').textContent = message;
            if (info) document.getElementById('blockedInfo').innerHTML = info;
        }

        function updateLoadingText(text) {
            document.getElementById('loadingText').textContent = text;
        }

        function contactAdmin() {
            window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=Assalamualaikum%20admin%2C%20akses%20saya%20ditolak', '_blank');
        }

        async function getFingerprint() {
            var fp = '';
            fp += navigator.userAgent || '';
            fp += navigator.language || '';
            fp += (screen.width || 0) + 'x' + (screen.height || 0);
            fp += screen.colorDepth || '';
            fp += new Date().getTimezoneOffset();
            fp += navigator.hardwareConcurrency || '';
            fp += navigator.deviceMemory || '';
            fp += navigator.platform || '';
            return CryptoJS.MD5(fp).toString();
        }

        async function getRecaptchaV3Token(action) {
            try {
                return await grecaptcha.execute(RECAPTCHA_V3_SITE_KEY, { action: action });
            } catch (e) {
                return null;
            }
        }

        function storageGet() {
            try {
                var encrypted = localStorage.getItem(STORAGE_KEY);
                if (!encrypted) return null;
                var decrypted = CryptoJS.AES.decrypt(encrypted, STORAGE_SECRET).toString(CryptoJS.enc.Utf8);
                return JSON.parse(decrypted) || null;
            } catch (e) { return null; }
        }

        async function checkBlocked() {
            updateLoadingText('Memeriksa fingerprint...');
            var fingerprint = await getFingerprint();
            var captchaToken = await getRecaptchaV3Token('check_blocked');

            updateLoadingText('Memeriksa keamanan IP & perangkat...');
            try {
                var res = await fetch(API_REVANSTORE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Fingerprint': fingerprint
                    },
                    body: JSON.stringify({
                        path: 'check_blocked',
                        method: 'POST',
                        data: {
                            fingerprint: fingerprint,
                            captchaToken: captchaToken
                        }
                    })
                });

                var result = await res.json();

                if (result.encrypted && result.data) {
                    var decrypted = CryptoJS.AES.decrypt(result.data, STORAGE_SECRET).toString(CryptoJS.enc.Utf8);
                    if (decrypted) result = JSON.parse(decrypted);
                }

                if (result && result.blocked) {
                    var blockType = result.blockType || 'device';
                    var until = result.blockedUntil || 0;
                    var untilText = until === 0 ? 'PERMANEN' : ('sampai ' + new Date(until).toLocaleString('id-ID'));

                    showBlockedScreen(
                        'AKSES DITOLAK',
                        'Maaf, akses Anda telah ditolak oleh sistem keamanan.',
                        '⏱️ Durasi: ' + untilText + '<br>' + (blockType === 'ip' ? '🌐 IP Anda diblokir.' : '📱 Perangkat Anda diblokir.')
                    );
                    return { blocked: true };
                }

                return { blocked: false, fingerprint: fingerprint };

            } catch (error) {
                console.error('Gagal cek blokir:', error);
                return { blocked: false, fingerprint: fingerprint };
            }
        }

        async function checkSession(fingerprint) {
            var saved = storageGet();
            if (!saved || !saved.value || !saved.value.username) {
                return { hasSession: false };
            }

            var session = saved.value;
            var age = Date.now() - (session.timestamp || 0);

            if (age > 7 * 24 * 60 * 60 * 1000) {
                localStorage.removeItem(STORAGE_KEY);
                return { hasSession: false };
            }

            updateLoadingText('Memverifikasi akun...');

            try {
                var captchaToken = await getRecaptchaV3Token('check_session');
                var res = await fetch(API_REVANSTORE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Fingerprint': fingerprint
                    },
                    body: JSON.stringify({
                        path: 'check_account_status',
                        method: 'POST',
                        data: {
                            username: session.username,
                            user_id: session.user_id,
                            fingerprint: fingerprint,
                            captchaToken: captchaToken
                        }
                    })
                });

                var result = await res.json();

                if (result.encrypted && result.data) {
                    var decrypted = CryptoJS.AES.decrypt(result.data, STORAGE_SECRET).toString(CryptoJS.enc.Utf8);
                    if (decrypted) result = JSON.parse(decrypted);
                }

                if (result && result.banAkses) {
                    var untilA = result.banAksesUntil || 0;
                    var untilTextA = untilA === 0 ? 'PERMANEN' : ('sampai ' + new Date(untilA).toLocaleString('id-ID'));
                    showBlockedScreen(
                        'AKSES DIBLOKIR',
                        'Maaf, akses Anda diblokir oleh admin.',
                        '⏱️ Durasi: ' + untilTextA
                    );
                    localStorage.removeItem(STORAGE_KEY);
                    return { hasSession: true, blocked: true };
                }

                if (result && result.valid) {
                    return { hasSession: true, valid: true };
                }

                localStorage.removeItem(STORAGE_KEY);
                return { hasSession: false };

            } catch (error) {
                console.error('Gagal cek session:', error);
                return { hasSession: true, valid: true };
            }
        }

        (async function() {
            grecaptcha.ready(async function() {
                var blockedCheck = await checkBlocked();
                if (blockedCheck.blocked) return;

                var sessionCheck = await checkSession(blockedCheck.fingerprint);
                if (sessionCheck.blocked) return;

                if (sessionCheck.hasSession && sessionCheck.valid) {
                    window.location.href = 'pages/dashboard.html';
                } else {
                    window.location.href = 'pages/login.html';
                }
            });
        })();
    </script>
</body>
</html>
