<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    :root {
        /* Fallback kalau theme Telegram belum siap */
        --bg-color: #ffffff;
        --text-color: #111111;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-color);
        color: var(--text-color);
    }
    h2 {
        margin: 4px 0 16px;
        font-size: 18px;
    }
    .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 14px;
        margin-bottom: 10px;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        cursor: pointer;
        transition: opacity 0.15s ease;
    }
    .btn:active { opacity: 0.75; }

    .btn-blue   { background: #3498DB; }
    .btn-green  { background: #2ECC71; }
    .btn-red    { background: #E74C3C; }
    .btn-yellow { background: #F39C12; }
    .btn-purple { background: #9B59B6; }
    .btn-gray   { background: #95A5A6; }
</style>
</head>
<body>

<h2>🎨 Pilih Menu</h2>

<button class="btn btn-blue"   onclick="pilih('login')">🔐 Login</button>
<button class="btn btn-green"  onclick="pilih('topup_info')">💰 Info Top Up</button>
<button class="btn btn-yellow" onclick="pilih('bantuan')">❓ Bantuan</button>
<button class="btn btn-purple" onclick="pilih('riwayat')">📜 Riwayat</button>
<button class="btn btn-red"    onclick="pilih('batal')">❌ Batal</button>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Ikut warna tema Telegram user (dark/light) otomatis
    document.documentElement.style.setProperty('--bg-color', tg.themeParams.bg_color || '#ffffff');
    document.documentElement.style.setProperty('--text-color', tg.themeParams.text_color || '#111111');

    function pilih(action) {
        // Kirim data balik ke bot -> ditangkap event 'web_app_data'
        tg.sendData(JSON.stringify({ action }));
        tg.close();
    }
</script>

</body>
</html>
